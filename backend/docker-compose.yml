# AISecLab 后端 —— 比赛 / 自托管一键部署
#
# 用法：
#   1) 复制 .env.example 为 .env，填入裁判模型配置（JUDGE_BASE_URL / JUDGE_MODEL / JUDGE_API_KEY）
#   2) docker compose up -d --build
#   3) 健康检查：docker compose ps 或 curl http://localhost:8000/health
#
# 改对外端口：把左边 "${PORT:-8000}:8000" 改成你想要的，例如 "80:8000"。
# 加鉴权：在 .env 里设置 API_TOKEN，除 /health 外的接口都需 Authorization: Bearer <token>。

services:
  aiseclab-backend:
    build: .
    image: aiseclab-backend:latest
    container_name: aiseclab-backend
    ports:
      - "${PORT:-8000}:8000"
    environment:
      JUDGE_BASE_URL: "${JUDGE_BASE_URL:-}"
      JUDGE_API_KEY: "${JUDGE_API_KEY:-}"
      JUDGE_MODEL: "${JUDGE_MODEL:-}"
      JUDGE_NAME: "${JUDGE_NAME:-}"
      API_TOKEN: "${API_TOKEN:-}"
      PORT: "8000"
    restart: unless-stopped
    volumes:
      - ./data:/app/data   # 持久化目录（当前后端为内存态，预留给报告落盘）
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health").status==200 else 1)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M   # 单用户红队测试足够；若 OOM 调到 1G
