<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" width="1000" height="612"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fa8bf"/></marker></defs><rect width="1000" height="612" fill="#ffffff"/><rect x="14.0" y="14.0" width="972.0" height="288.0" rx="7" fill="#f6fafd" stroke="#c3d3e2" stroke-width="1.2"/><text x="34.0" y="42.0" font-size="15" font-weight="700" fill="#10243a" text-anchor="start">Android 端 · 本机跑</text><text x="210.0" y="42.0" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="start">不依赖后端，断网也能出报告</text><rect x="34.0" y="62.0" width="145.0" height="80.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="106.5" y="88.0" font-size="12.5" font-weight="600" fill="#10243a" text-anchor="middle">用例装载</text><text x="106.5" y="108.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">JailbreakCases</text><text x="106.5" y="124.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">50 条基线</text><line x1="180.0" y1="102.0" x2="189.0" y2="102.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><rect x="191.0" y="62.0" width="145.0" height="80.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="263.5" y="88.0" font-size="12.5" font-weight="600" fill="#10243a" text-anchor="middle">攻击变异</text><text x="263.5" y="108.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">MutationEngine</text><text x="263.5" y="124.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">6 种变体</text><line x1="337.0" y1="102.0" x2="346.0" y2="102.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><rect x="348.0" y="62.0" width="145.0" height="80.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="420.5" y="88.0" font-size="12.5" font-weight="600" fill="#10243a" text-anchor="middle">递归攻击（可选）</text><text x="420.5" y="108.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">最多 10 轮</text><text x="420.5" y="124.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">破防即取证</text><line x1="494.0" y1="102.0" x2="503.0" y2="102.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><rect x="505.0" y="62.0" width="145.0" height="80.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="577.5" y="88.0" font-size="12.5" font-weight="600" fill="#10243a" text-anchor="middle">目标调用</text><text x="577.5" y="108.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">TargetCaller</text><text x="577.5" y="124.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">OpenAI 兼容</text><line x1="651.0" y1="102.0" x2="660.0" y2="102.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><rect x="662.0" y="62.0" width="145.0" height="80.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="734.5" y="88.0" font-size="12.5" font-weight="600" fill="#10243a" text-anchor="middle">判定链</text><text x="734.5" y="108.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">闸门·护栏</text><text x="734.5" y="124.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">规则·投票</text><line x1="808.0" y1="102.0" x2="817.0" y2="102.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><rect x="819.0" y="62.0" width="145.0" height="80.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="891.5" y="88.0" font-size="12.5" font-weight="600" fill="#10243a" text-anchor="middle">打分</text><text x="891.5" y="108.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">ScoringModel</text><text x="891.5" y="124.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">→ Report</text><line x1="891.5" y1="142.0" x2="891.5" y2="164.0" stroke="#8fa8bf" stroke-width="1.4"/><text x="899.5" y="157.0" font-size="10.5" font-weight="400" fill="#3f6f9f" text-anchor="start">Report</text><line x1="144.0" y1="164.0" x2="891.5" y2="164.0" stroke="#8fa8bf" stroke-width="1.4"/><line x1="144.0" y1="164.0" x2="144.0" y2="184.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><line x1="380.0" y1="164.0" x2="380.0" y2="184.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><line x1="616.0" y1="164.0" x2="616.0" y2="184.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><line x1="852.0" y1="164.0" x2="852.0" y2="184.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><rect x="34.0" y="186.0" width="220.0" height="68.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="144.0" y="210.0" font-size="12" font-weight="600" fill="#10243a" text-anchor="middle">四路分区</text><text x="144.0" y="229.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">失守 / 待复核</text><text x="144.0" y="244.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">调用失败 / 判定拿不准</text><rect x="270.0" y="186.0" width="220.0" height="68.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="380.0" y="210.0" font-size="12" font-weight="600" fill="#10243a" text-anchor="middle">分层归因</text><text x="380.0" y="229.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">DefenseAttribution</text><text x="380.0" y="244.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">失守发生在哪一层</text><rect x="506.0" y="186.0" width="220.0" height="68.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="616.0" y="210.0" font-size="12" font-weight="600" fill="#10243a" text-anchor="middle">加固建议</text><text x="616.0" y="229.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">HardeningAdvisor</text><text x="616.0" y="244.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">只对攻击类失守出</text><rect x="742.0" y="186.0" width="220.0" height="68.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="852.0" y="210.0" font-size="12" font-weight="600" fill="#10243a" text-anchor="middle">导出</text><text x="852.0" y="229.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">Markdown / HTML</text><text x="852.0" y="244.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">报告页可离线打开</text><rect x="14.0" y="322.0" width="972.0" height="270.0" rx="7" fill="#f4faf6" stroke="#bcd7c6" stroke-width="1.2"/><text x="34.0" y="350.0" font-size="15" font-weight="700" fill="#10243a" text-anchor="start">委托后端跑</text><text x="133.0" y="350.0" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="start">后端与端上跑同一套判定链，逐条落检查点</text><rect x="34.0" y="372.0" width="176.0" height="76.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="122.0" y="398.0" font-size="13" font-weight="600" fill="#10243a" text-anchor="middle">POST /v1/sessions</text><text x="122.0" y="418.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">建会话</text><text x="122.0" y="434.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">带目标与裁判配置</text><line x1="211.0" y1="410.0" x2="222.0" y2="410.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><rect x="224.0" y="372.0" width="176.0" height="76.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="312.0" y="398.0" font-size="13" font-weight="600" fill="#10243a" text-anchor="middle">asyncio 任务</text><text x="312.0" y="418.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">后台跑整轮</text><text x="312.0" y="434.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">不占请求线程</text><line x1="401.0" y1="410.0" x2="412.0" y2="410.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><rect x="414.0" y="372.0" width="176.0" height="76.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="502.0" y="398.0" font-size="13" font-weight="600" fill="#10243a" text-anchor="middle">engine.run_session</text><text x="502.0" y="418.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">与端上同源</text><text x="502.0" y="434.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">同一份判定链</text><line x1="591.0" y1="410.0" x2="602.0" y2="410.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><rect x="604.0" y="372.0" width="176.0" height="76.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="692.0" y="398.0" font-size="13" font-weight="600" fill="#10243a" text-anchor="middle">检查点 + SSE</text><text x="692.0" y="418.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">每条原子落盘</text><text x="692.0" y="434.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">15s 心跳保活</text><line x1="781.0" y1="410.0" x2="792.0" y2="410.0" stroke="#8fa8bf" stroke-width="1.5" marker-end="url(#ar)"/><rect x="794.0" y="372.0" width="176.0" height="76.0" rx="7" fill="#ffffff" stroke="#a8bfd4" stroke-width="1.2"/><text x="882.0" y="398.0" font-size="13" font-weight="600" fill="#10243a" text-anchor="middle">GET /v1/reports/{id}</text><text x="882.0" y="418.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">取报告 JSON</text><text x="882.0" y="434.0" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">可导出 MD/HTML</text><text x="500.0" y="494.0" font-size="10.5" font-weight="400" fill="#3f5648" text-anchor="middle">停止 = POST /v1/sessions/{sid}/cancel → 标 interrupted，检查点保留，可续跑</text><text x="500.0" y="520.0" font-size="10.5" font-weight="400" fill="#3f5648" text-anchor="middle">两条链路产出的是同一份 Report 结构：端上 Kotlin 与后端 Python 的判定口径由工具逐字比对</text><text x="500.0" y="552.0" font-size="10.5" font-weight="400" fill="#7c8f84" text-anchor="middle">① 端上跑完不经过后端　② 委托后端时端上只负责订阅 SSE 与展示</text></svg>